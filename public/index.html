<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <!-- SEO: Meta descripción -->
    <meta
      name="description"
      content="Chat para superhéroes con integración de GPS, cámara y recursos nativos de PWA."
    />

    <meta
      name="google-site-verification"
      content="hFEl17VrZtT3coFaemBNBLAlUOWTkj41OvsUTsY0gBI"
    />
    <title>Chat para superheroes</title>

    <!-- Optimización: Preconectar con orígenes críticos -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://unpkg.com" />

    <link
      href="https://fonts.googleapis.com/css?family=Quicksand:300,400"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Lato:400,300"
      rel="stylesheet"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.3.1/css/all.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="js/libs/plugins/mdtoast.min.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.0/animate.css"
    />
    <link rel="shortcut icon" type="image/ico" href="img/favicon.ico" />
    <link rel="manifest" href="manifest.json" />

    <!-- Android -->
    <meta name="theme-color" content="#3498db" />

    <!-- IOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="img/icons/icon-192x192.png" />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="img/icons/icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="img/icons/icon-192x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="img/icons/icon-152x152.png"
    />

    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
      href="img/icons-ios/apple-launch-1125x2436.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
      href="img/icons-ios/apple-launch-750x1334.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)"
      href="img/icons-ios/apple-launch-1242x2208.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)"
      href="img/icons-ios/apple-launch-640x1136.png"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="ChatPWA" />
  </head>
  <body>
    <!-- Titulo -->
    <span class="first">
      <span
        id="salir-btn"
        class="fa fa-sign-out-alt out oculto animated fadeIn"
      ></span>
      <span id="titulo"> <i class="fa fa-user"></i> Seleccione Personaje </span>
      <span
        id="nuevo-btn"
        class="fa fa-pen-square new oculto animated fadeIn fast"
      ></span>
    </span>

    <!-- MAIN LANDMARK: Contenido principal de la app -->
    <main>
      <!-- Modal -->
      <div id="modal" class="oculto">
        <img
          id="modal-avatar"
          src="img/avatars/spiderman.jpg"
          width="50"
          height="50"
          alt="Avatar de usuario"
        />

        <span class="first">
          <span id="titulo-modal">Nuevo mensaje</span>
          <span id="cancel-btn" class="fa fa-times"></span>
        </span>

        <div class="nuevo-mensaje">
          <textarea
            id="txtMensaje"
            placeholder="Nuevo mensaje..."
            rows="5"
          ></textarea>

          <div class="camara-contenedor fadeIn fast oculto" align="center">
            <video id="player" autoplay style="height: 300px"></video>
            <button id="tomar-foto-btn">
              <i class="fa fa-camera"></i> Tomar Foto
            </button>
          </div>

          <div class="video-contenedor fadeIn fast oculto" align="center">
            <video
              id="player-video"
              autoplay
              muted
              playsinline
              style="height: 300px"
            ></video>
            <span id="grabacion-estado" class="grabacion-estado oculto">
              <i class="fa fa-circle"></i>
              <span id="tiempo-grabacion">00:00</span>
            </span>
            <button id="grabar-video-btn">
              <i class="fa fa-video"></i> Grabar Video
            </button>
            <button id="detener-video-btn" class="oculto">
              <i class="fa fa-stop"></i> Detener
            </button>
            <p class="formato-video">Formato: video/webm</p>
          </div>
        </div>

        <div id="post-btn" class="fab"><i class="fa fa-paper-plane"></i></div>
        <div id="location-btn" class="fab-marker">
          <i class="fa fa-map-marker-alt"></i>
        </div>
        <div id="photo-btn" class="fab-photo"><i class="fa fa-camera"></i></div>
        <div id="video-btn" class="fab-video"><i class="fa fa-video"></i></div>
      </div>

      <!-- Seleccion de personaje -->
      <div id="seleccion" class="seleccion animated fadeIn fast" align="center">
        <button class="oculto btn-noti-activadas">
          Notificaciones Activadas
        </button>
        <button class="oculto btn-noti-desactivadas">
          Notificaciones Desactivadas
        </button>

        <div id="capacidades-panel">
          <button id="btn-vibrar">Vibrar</button>
          <button id="btn-bateria">Estado de Batería</button>
          <button id="btn-red">Información de Red</button>
          <button id="btn-compartir">Compartir texto de prueba</button>
          <button id="btn-compartir-foto">Compartir última foto</button>
          <button id="btn-exportar">Exportar mensajes (JSON)</button>
          <label id="wake-lock-label" style="display: none; margin-top: 10px">
            <input type="checkbox" id="wake-lock-toggle" /> Mantener pantalla
            encendida
          </label>
          <button id="btn-bluetooth">Conectar Bluetooth (GATT)</button>
        </div>

        <div>
          <img
            data-user="spiderman"
            src="img/avatars/spiderman.jpg"
            alt="spiderman"
            class="seleccion-avatar"
            width="150"
            height="150"
          />
        </div>
        <div>
          <img
            data-user="ironman"
            src="img/avatars/ironman.jpg"
            alt="ironman"
            class="seleccion-avatar"
            width="150"
            height="150"
          />
        </div>
        <div>
          <img
            data-user="wolverine"
            src="img/avatars/wolverine.jpg"
            alt="wolverine"
            class="seleccion-avatar"
            width="150"
            height="150"
          />
        </div>
        <div>
          <img
            data-user="thor"
            src="img/avatars/thor.jpg"
            alt="thor"
            class="seleccion-avatar"
            width="150"
            height="150"
          />
        </div>
        <div>
          <img
            data-user="hulk"
            src="img/avatars/hulk.jpg"
            alt="hulk"
            class="seleccion-avatar"
            width="150"
            height="150"
          />
        </div>
      </div>

      <!-- Lista de mensajes -->
      <ul id="timeline" class="timeline oculto"></ul>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="js/libs/plugins/mdtoast.min.js"></script>
    <script src="js/camara-class.js"></script>
    <script src="js/app.js"></script>

    <!-- Web Vitals (Opción B - CDN) -->
    <script type="module">
      import {
        onLCP,
        onINP,
        onCLS,
      } from "https://unpkg.com/web-vitals@5/dist/web-vitals.attribution.js?module";
      onLCP(console.log);
      onINP(console.log);
      onCLS(console.log);
    </script>
  </body>
</html>
